<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cairn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14120F">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cairn">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* layout concept: sticky day-header + scrollable exercise list + bottom tab bar (thumb reach for gym use) */
:root{
  --bg:#14120F; --surface:#1E1B17; --surface2:#262220; --line:#34302A;
  --fg:#F2EEE7; --muted:#A39C8E; --faint:#6E6A61;
  --accent:#E0A233; --accent-fg:#14120F;
  --good:#6FA96B; --good-bg:#233020;
  --warn:#D68A3E; --bad:#D4665A;
  --radius:10px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F5F2EC; --surface:#FFFFFF; --surface2:#ECE7DE; --line:#DDD6C9;
    --fg:#1C1915; --muted:#6E675C; --faint:#948C7E;
    --accent:#A6631B; --accent-fg:#FFFFFF;
    --good:#3F7A3B; --good-bg:#E4EEDF;
    --warn:#9A5B12; --bad:#B3382C;
    color-scheme: light;
  }
}
:root[data-theme="light"]{
  --bg:#F5F2EC; --surface:#FFFFFF; --surface2:#ECE7DE; --line:#DDD6C9;
  --fg:#1C1915; --muted:#6E675C; --faint:#948C7E;
  --accent:#A6631B; --accent-fg:#FFFFFF;
  --good:#3F7A3B; --good-bg:#E4EEDF;
  --warn:#9A5B12; --bad:#B3382C;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#14120F; --surface:#1E1B17; --surface2:#262220; --line:#34302A;
  --fg:#F2EEE7; --muted:#A39C8E; --faint:#6E6A61;
  --accent:#E0A233; --accent-fg:#14120F;
  --good:#6FA96B; --good-bg:#233020;
  --warn:#D68A3E; --bad:#D4665A;
  color-scheme: dark;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html{ height:100%; background:var(--bg); }
body{ min-height:calc(100% + 2px); min-height:calc(100lvh + 2px); }
body{
  background:var(--bg); color:var(--fg);
  font-family:'Archivo', system-ui, sans-serif;
  font-size:15px; line-height:1.4;
  padding-left:16px; padding-right:16px;
  display:flex; flex-direction:column;
  overscroll-behavior-y:contain;
}
h1,h2,h3{ font-family:'Big Shoulders', 'Archivo Black', system-ui, sans-serif; font-weight:700; margin:0; text-transform:uppercase; letter-spacing:.02em; }
.tabular{ font-variant-numeric: tabular-nums; }
button{ font-family:inherit; touch-action:manipulation; }
input,select{ font-family:inherit; touch-action:manipulation; }
/* keep every tappable control >=16px so iOS doesn't auto-zoom on focus, and >=40px tall to actually hit at the gym */
input,select,button{ font-size:16px; }
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
input[type=number]{ -moz-appearance:textfield; }

/* ---- header ---- */
.topbar{
  position:sticky; top:0; z-index:10;
  background:var(--bg); padding-block:calc(12px + env(safe-area-inset-top,0px)) 8px; margin-inline:-16px; padding-inline:16px;
  border-bottom:1px solid var(--line);
}
.daynav{ display:flex; align-items:center; gap:10px; }
.daynav .navbtn{
  background:var(--surface2); border:1px solid var(--line); color:var(--fg);
  width:36px; height:36px; border-radius:8px; font-size:18px; line-height:1;
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
}
.daynav .navbtn:active{ background:var(--line); }
.daynav .navbtn[disabled]{ opacity:.35; }
.daytitle{ flex:1; min-width:0; }
.daytitle .wk{ color:var(--accent); font-size:12px; letter-spacing:.08em; }
.daytitle h1{ font-size:26px; line-height:1.05; }
.daytitle .focus{ color:var(--muted); font-size:13px; margin-top:2px; }
.todaypill{
  background:transparent; border:1px solid var(--accent); color:var(--accent);
  font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  padding:5px 9px; border-radius:20px; flex:0 0 auto;
}
.todaypill[hidden]{ display:none; }
.edittoggle{
  background:var(--surface2); border:1px solid var(--line); color:var(--muted);
  width:36px; height:36px; border-radius:8px; font-size:15px; flex:0 0 auto;
}
.edittoggle.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }
.edittoggle[hidden]{ display:none; }

/* ---- main scroll area ---- */
main{ flex:1; padding-block:14px 90px; display:flex; flex-direction:column; gap:12px; min-width:0; }

/* ---- exercise card ---- */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 14px; display:flex; flex-direction:column; gap:8px; min-width:0;
}
.card.primary{ border-color:var(--accent); box-shadow: inset 3px 0 0 var(--accent); padding-left:12px; }
.card.cardhidden{ opacity:.5; border-style:dashed; }
.card .exhead{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; flex-wrap:wrap; }
.card .exname{ font-family:'Big Shoulders', system-ui, sans-serif; font-weight:600; font-size:17px; text-transform:none; letter-spacing:0; }
.card .chips{ display:flex; gap:6px; flex-wrap:wrap; }
.chip{ font-size:11.5px; color:var(--muted); background:var(--surface2); border:1px solid var(--line); border-radius:20px; padding:3px 8px; white-space:nowrap; }
.chip.wt{ color:var(--accent-fg); background:var(--accent); border-color:var(--accent); font-weight:600; }
.card .notes{ color:var(--muted); font-size:12.5px; }
.mchips{ display:flex; gap:5px; flex-wrap:wrap; margin-top:-2px; }
.mchip{ font-size:10.5px; color:var(--faint); letter-spacing:.03em; text-transform:uppercase; }
.mchip::after{ content:'·'; margin-left:5px; color:var(--line); }
.mchip:last-child::after{ content:''; }
.setadjrow{ display:flex; align-items:center; gap:8px; }
.setadjlabel{ font-size:11.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.04em; }
.stepbtn{
  width:26px; height:26px; border-radius:50%; border:1px solid var(--line); background:var(--surface2);
  color:var(--fg); font-size:15px; line-height:1; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
}
.setcount{ font-size:14px; font-weight:600; min-width:14px; text-align:center; }
.setadjnote{ font-size:11px; color:var(--faint); font-style:italic; }
.cardedit{ display:flex; align-items:center; gap:8px; padding-top:6px; border-top:1px solid var(--line); flex-wrap:wrap; }
.customtag{ font-size:10.5px; color:var(--accent); letter-spacing:.06em; font-weight:700; }
.ghostbtn{ background:transparent; border:1px solid var(--line); color:var(--muted); font-size:12px; padding:5px 10px; border-radius:20px; }
.ghostbtn.danger{ color:var(--warn); border-color:var(--warn); }
.ghostbtn[hidden]{ display:none; }

.setrow{ display:grid; grid-template-columns:20px 1fr 58px 50px 42px 36px; gap:5px; align-items:center; }
@media (max-width:360px){
  .setrow{ grid-template-columns:16px 1fr 50px 44px 38px 34px; gap:4px; }
  .setrow input{ padding-inline:2px; }
}
.setrow .setno{ color:var(--faint); font-size:12px; }
.setrow .target{ color:var(--muted); font-size:12px; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.setrow.prefilled input{ color:var(--accent); border-style:dashed; }
.lastflag{ display:block; font-size:9.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.04em; }
.setrow input{
  background:var(--surface2); border:1px solid var(--line); color:var(--fg);
  border-radius:6px; padding:8px 4px; font-size:16px; width:100%; text-align:center; min-height:38px;
}
.setrow input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
.cardiorow{ display:grid; grid-template-columns:1fr 1fr 1fr 1fr 36px; gap:6px; align-items:end; }
@media (max-width:360px){ .cardiorow{ grid-template-columns:1fr 1fr 1fr 1fr 32px; gap:4px; } }
.cardiofield{ display:flex; flex-direction:column; gap:3px; }
.cardiofield label{ font-size:9.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.04em; text-align:center; }
.cardiorow input{
  background:var(--surface2); border:1px solid var(--line); color:var(--fg);
  border-radius:6px; padding:8px 4px; font-size:16px; width:100%; text-align:center; min-height:38px;
}
.cardiorow input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
.donebtn{
  width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--surface2);
  color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:15px; flex:0 0 auto;
}
.donebtn.on{ background:var(--good-bg); border-color:var(--good); color:var(--good); }

.checkrow{ display:flex; align-items:center; gap:10px; }
.checkrow .donebtn{ flex:0 0 auto; }
.checkrow .label{ color:var(--fg); font-size:14px; }

.dayempty{ color:var(--muted); text-align:center; padding:40px 10px; }

.addcard{ border-style:dashed; }
.addbtn{ background:transparent; border:none; color:var(--accent); font-size:14px; font-weight:600; padding:6px 0; width:100%; text-align:left; }
.addfields{ display:flex; flex-direction:column; gap:8px; }
.addfields input{ background:var(--surface2); border:1px solid var(--line); color:var(--fg); border-radius:8px; padding:10px; font-size:16px; width:100%; min-height:42px; }
.addrow3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.muscpick{ display:flex; gap:6px; flex-wrap:wrap; }
.mpick{ background:var(--surface2); border:1px solid var(--line); color:var(--muted); font-size:11.5px; padding:5px 9px; border-radius:20px; }
.mpick.on{ background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }
.addbtnrow{ display:flex; gap:8px; }
.addbtnrow .savebtn{ padding:9px 16px; }

/* ---- history view ---- */
.selectwrap{ position:relative; }
select{
  width:100%; background:var(--surface); border:1px solid var(--line); color:var(--fg);
  border-radius:var(--radius); padding:11px 12px; font-size:16px; appearance:none; min-height:44px;
}
.chartbox{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:10px; position:relative; }
.chartbox canvas{ display:block; width:100%; height:150px; }
.chartempty{ color:var(--muted); font-size:13px; text-align:center; padding:40px 0; }
.tooltip{
  position:absolute; pointer-events:none; background:var(--surface2); border:1px solid var(--line);
  border-radius:6px; padding:4px 8px; font-size:12px; color:var(--fg); transform:translate(-50%,-115%);
  white-space:nowrap; display:none;
}
table.hist{ width:100%; border-collapse:collapse; font-size:13px; }
table.hist th{ text-align:left; color:var(--faint); font-weight:500; font-size:11px; letter-spacing:.05em; text-transform:uppercase; padding:6px 6px; border-bottom:1px solid var(--line); }
table.hist td{ padding:7px 6px; border-bottom:1px solid var(--line); color:var(--fg); }
table.hist td.mut{ color:var(--muted); }
.histwrap{ overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); }
.histwrap table{ min-width:100%; }

/* ---- maxes view ---- */
.maxrow{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; }
.maxrow label{ font-size:14px; }
.maxrow .sub{ color:var(--muted); font-size:11.5px; margin-top:1px; }
.maxrow input{
  background:var(--surface2); border:1px solid var(--line); color:var(--fg); border-radius:8px;
  padding:8px 6px; font-size:16px; width:76px; text-align:center;
}
.savebar{ display:flex; align-items:center; gap:10px; }
.savebtn{ background:var(--accent); color:var(--accent-fg); border:none; border-radius:var(--radius); padding:11px 18px; font-size:14px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; flex:1; }
.savebtn[disabled]{ opacity:.5; }
.savedflag{ color:var(--good); font-size:12.5px; }
.offlineflag{ color:var(--warn); font-size:12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:8px 12px; }

/* ---- bottom tabs ---- */
.tabbar{
  position:fixed; left:0; right:0; bottom:calc(0px - var(--vgap,0px)); z-index:10;
  background:var(--surface); border-top:1px solid var(--line);
  padding:8px 16px max(8px, calc(env(safe-area-inset-bottom,0px) - 14px));
  display:flex; gap:6px;
}
.tabbtn{
  flex:1; background:transparent; border:none; color:var(--muted);
  font-size:11px; letter-spacing:.04em; text-transform:uppercase; font-weight:600;
  display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; border-radius:8px;
}
.tabbtn .ic{ font-size:17px; }
.tabbtn.active{ color:var(--accent); background:var(--surface2); }

/* ---- plan tab ---- */
.plannav{ display:flex; gap:6px; flex-wrap:wrap; }
.plannav .mpick{ font-size:12.5px; padding:7px 12px; }
.jcard{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); min-width:0; }
.jcard summary{
  list-style:none; cursor:pointer; padding:13px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  font-family:'Big Shoulders', system-ui, sans-serif; font-weight:700; font-size:19px; text-transform:uppercase; letter-spacing:.02em;
}
.jcard summary::-webkit-details-marker{ display:none; }
.jcard summary .chev{ color:var(--muted); font-size:16px; transition:transform .15s; }
.jcard[open] summary .chev{ transform:rotate(90deg); }
.jbody{ padding:0 14px 14px; display:flex; flex-direction:column; gap:12px; }
.jlabel{ font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); font-weight:600; margin-bottom:3px; }
.jlabel.stop{ color:var(--warn); }
.jlabel.fine{ color:var(--good); }
.jtext{ font-size:14px; line-height:1.45; }
.ptag{ font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); font-weight:700; }
.phase .row2{ display:flex; flex-direction:column; gap:3px; }
.phase.now{ border-color:var(--accent); }
.bcard .howto{ color:var(--muted); font-size:12.5px; }
.bgrid{ display:grid; grid-template-columns:1fr 1fr 74px; gap:8px; align-items:end; }
.bfield{ display:flex; flex-direction:column; gap:3px; min-width:0; }
.bfield label{ font-size:9.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.04em; }
.bfield input{
  background:var(--surface2); border:1px solid var(--line); color:var(--fg);
  border-radius:6px; padding:8px 6px; font-size:16px; width:100%; text-align:center; min-height:38px;
}
.bfield input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
.bchange{ text-align:center; font-weight:700; font-size:15px; min-height:38px; display:flex; align-items:center; justify-content:center; color:var(--faint); }
.bchange.up{ color:var(--good); }
.bchange.down{ color:var(--warn); }
.zonebox{ display:grid; grid-template-columns:76px 1fr 1fr; gap:8px; align-items:end; }
.zonebox .val{ min-height:38px; display:flex; align-items:center; justify-content:center; background:var(--surface2); border:1px solid var(--line); border-radius:6px; font-weight:600; font-size:14px; }
.tabbtn{ min-width:0; }


/* ---- cairn additions ---- */
.viewhead .brand, .sheetin .brand{ color:var(--accent); font-size:12px; letter-spacing:.14em; font-family:'Big Shoulders', system-ui, sans-serif; font-weight:700; }
.brand{ display:flex; align-items:center; gap:6px; }
.clogo{ width:20px; height:20px; display:block; }
.viewhead h1{ font-size:26px; line-height:1.05; }
.subbody{ display:flex; flex-direction:column; gap:12px; min-width:0; }
.ready{ border:1px solid var(--line); border-left-width:4px; border-radius:var(--radius); background:var(--surface); padding:12px 14px; display:flex; flex-direction:column; gap:10px; min-width:0; }
.ready.green{ border-left-color:var(--good); } .ready.yellow{ border-left-color:var(--yellow); } .ready.red{ border-left-color:var(--bad); }
.rhead{ display:flex; align-items:center; gap:8px; }
.rdot{ width:10px; height:10px; border-radius:50%; background:var(--faint); flex:0 0 auto; }
.green .rdot{ background:var(--good); } .yellow .rdot{ background:var(--yellow); } .red .rdot{ background:var(--bad); }
.rtitle{ font-family:'Big Shoulders', system-ui, sans-serif; font-weight:700; font-size:18px; text-transform:uppercase; letter-spacing:.02em; flex:1; }
.rsum{ font-size:12px; color:var(--faint); text-transform:capitalize; }
.rtext{ font-size:13.5px; color:var(--muted); }
.rq{ display:flex; flex-direction:column; gap:5px; }
.rql{ font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); font-weight:600; }
.rqopts{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.ropt{ min-height:42px; background:var(--surface2); border:1px solid var(--line); color:var(--fg); border-radius:8px; font-size:14px; }
.ropt.on{ background:var(--accent); border-color:var(--accent); color:var(--accent-fg); font-weight:700; }
.rareas, .rbtns{ display:flex; gap:6px; flex-wrap:wrap; }
.restbar{ position:fixed; left:16px; right:16px; bottom:calc(70px - var(--vgap,0px) + max(0px, calc(env(safe-area-inset-bottom,0px) - 14px))); z-index:12; background:var(--surface); border:1px solid var(--accent); border-radius:12px; overflow:hidden; box-shadow:0 6px 20px rgba(0,0,0,.35); }
.restbar .rfill{ position:absolute; left:0; top:0; bottom:0; width:0; background:var(--surface2); transition:width .25s linear; }
.restbar .rin{ position:relative; display:flex; align-items:center; gap:10px; padding:9px 12px; }
.restbar .rlab{ flex:1; min-width:0; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.restbar .rtime{ font-family:'Big Shoulders', system-ui, sans-serif; font-weight:700; font-size:28px; min-width:56px; text-align:center; }
.restbar.go{ background:var(--accent); } .restbar.go .rtime, .restbar.go .rlab{ color:var(--accent-fg); } .restbar.go .rfill{ background:transparent; }
.rbtn2{ background:var(--surface2); border:1px solid var(--line); color:var(--fg); border-radius:8px; font-size:13px; padding:8px 10px; min-height:36px; }
body.restshown main{ padding-bottom:150px; }
.finishbtn{ width:100%; flex:none; }
.sheet{ position:fixed; inset:0; bottom:calc(0px - var(--vgap,0px)); z-index:30; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center; }
.sheetin{ background:var(--bg); border-top:1px solid var(--line); border-radius:16px 16px 0 0; width:100%; max-width:560px; max-height:88vh; overflow:auto; padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:14px; color:var(--fg); }
#stList,#skList,#flList{ display:flex; flex-direction:column; gap:8px; }
.skipcard{ border-color:var(--warn); }
.statrow{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.stat{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; min-width:0; }
.stat .sv{ font-family:'Big Shoulders', system-ui, sans-serif; font-weight:700; font-size:24px; line-height:1.1; }
.stat .sl{ font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mbar{ display:grid; grid-template-columns:86px 1fr 54px; gap:8px; align-items:center; font-size:13px; }
.mtrack{ height:10px; border-radius:6px; background:var(--surface2); position:relative; overflow:hidden; }
.mfill{ position:absolute; left:0; top:0; bottom:0; background:var(--accent); border-radius:6px; }
.mfill.full{ background:var(--good); }
.mplan{ position:absolute; left:0; top:0; bottom:0; background:var(--line); border-radius:6px; }
.fgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:8px; }
.rgrid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.rcell{ display:flex; flex-direction:column; align-items:center; gap:3px; }
.rsq{ width:100%; aspect-ratio:1; border-radius:6px; background:var(--surface2); border:1px solid var(--line); }
.rsq.green{ background:var(--good); border-color:var(--good); } .rsq.yellow{ background:var(--yellow); border-color:var(--yellow); } .rsq.red{ background:var(--bad); border-color:var(--bad); }
.rcl{ font-size:10px; color:var(--faint); }
.setline{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.switch{ width:48px; height:28px; border-radius:16px; border:1px solid var(--line); background:var(--surface2); position:relative; flex:0 0 auto; padding:0; }
.switch::after{ content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:var(--muted); transition:left .15s; }

<style id="polish">

body{ font-feature-settings:'tnum' 1,'cv11' 1; -webkit-font-smoothing:antialiased; }

.daytitle .focus{ font-size:13.5px; margin-top:3px; color:var(--muted); }
.daynav .navbtn, .edittoggle{ background:transparent; border:1px solid var(--line); border-radius:12px; width:38px; height:38px; }

.viewhead h1{ font-size:32px; line-height:1; }
.cairnmeter{ width:26px; height:40px; flex:0 0 auto; display:block; margin-right:2px; }

.cairnmeter ellipse.lit{ fill:var(--accent); stroke:var(--accent); }
.cairnmeter.full ellipse{ filter:drop-shadow(0 0 3px color-mix(in srgb,var(--accent) 55%,transparent)); }

/* cards: layered surfaces, fewer outlines */
.card, .jcard, .maxrow, .stat, .chartbox, .histwrap, .offlineflag, .ready{
  border-color:transparent; border-radius:var(--radius);

}
.card{ padding:14px 16px; gap:10px; }

.setrow input[data-field="rpe"]{ font-size:16px; font-family:inherit; font-weight:500; }

.setrow input:focus{ outline:none; box-shadow:0 0 0 2px var(--accent); }

.donebtn.on{ background:var(--accent); border-color:var(--accent); color:var(--accent-fg); font-weight:800; }

function pad(n){ return n<10 ? '0'+n : ''+n; }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtDate(s){
  const [y,m,d] = s.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined, {month:'short', day:'numeric'});
}
function findTodayIdx(){
  const t = todayStr();
  let idx = WORKOUTS.findIndex(w => w.date === t);
  if (idx >= 0) return idx;
  if (t < WORKOUTS[0].date) return 0;
  if (t > WORKOUTS[WORKOUTS.length-1].date) return WORKOUTS.length-1;
  for (let i=0;i<WORKOUTS.length-1;i++){
    if (WORKOUTS[i].date <= t && t < WORKOUTS[i+1].date) return i;
  }
  return 0;
}
function roundTo5(n){ return Math.round(n/5)*5; }

/* combine program items for the current day with hidden/custom/set-count overrides */
function dayItems(){
  const w = WORKOUTS[curIdx];
  const hidden = new Set(dayEdit.hidden || []);
  const setAdj = dayEdit.setAdj || {};
  const program = w.items.map(it => {
    const base = it.sets;
    let eff = (base != null && setAdj[it.k] != null) ? setAdj[it.k] : base;
    let rec = null;
    const rl = recLevel();
    if (rl && base != null && setAdj[it.k] == null && base >= 3 && it.lift && !it.ramp && !/warm-up|attempt/i.test(it.ex)){
      const cut = rl==='red' ? 2 : 1;
      const rs = Math.max(2, base-cut);
      if (rs < base){ eff = rs; rec = { from: base, to: rs }; }
    }
    const raw = (base != null && eff !== base) ? `${eff}x${it.reps ?? ''}` : it.raw;
    return { ...it, sets: eff, baseSets: base, raw, rec, hidden: hidden.has(it.k) || (!!w.planHide && !it.plan), custom:false };
  });
  const custom = (dayEdit.custom || []).map(c => {
    const k = 'custom-'+c.id;
    const base = c.sets||null;
    const eff = (base != null && setAdj[k] != null) ? setAdj[k] : base;
    return {
      k, ex: c.ex, raw: eff ? `${eff}x${c.reps||''}` : null,
      sets: eff, baseSets: base, reps: c.reps||null, lift:null, pct:null, tw: c.tw ?? null,
      rpe: c.rpe || null, rest: null, notes: c.notes || null, muscles: c.muscles || [],
      hidden:false, custom:true, customId: c.id,
    };
  });
  return { program, custom, all: program.concat(custom) };
}

function watchDayLogs(){
  if (unsubLogs) { unsubLogs(); unsubLogs = null; }
  logDoc = {};
  if (!db) return;
  const date = WORKOUTS[curIdx].date;
  let firstLoad = true;
  unsubLogs = db.collection('logs').where('date','==',date).onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { next[d.data().itemKey] = d.data(); });
    logDoc = next;
    // Only the first delivery rebuilds the screen. Every save we make ourselves is already
    // reflected on screen the moment it happens (see commitRow/adjustSetCount), so re-rendering
    // again when that same write echoes back would tear down and rebuild every input —
    // stealing focus out from under the keyboard mid-tap and flashing stale values on the way.
    if (firstLoad){ firstLoad = false; renderDay(); }
  }, err => { console.warn('logs sub error', err); });
}

/* pull the most recent PRIOR session's numbers for each exercise on this day, so an
   unfilled set can start from what was actually done last time instead of a blank field */
async function loadPriorPerf(){
  priorPerf = {};
  if (offline || !db) { renderDay(); return; }
  const w = WORKOUTS[curIdx];
  const names = Array.from(new Set(w.items.filter(it => it.sets != null).map(it => it.ex)));
  await Promise.all(names.map(async (ex) => {
    try{
      const snap = await db.collection('logs')
        .where('exercise','==',ex).where('date','<',w.date)
        .orderBy('date','desc').limit(1).get();
      if (snap.docs.length && snap.docs[0].data().sets) priorPerf[ex] = snap.docs[0].data().sets;
    }catch(e){ /* leave unfilled if the lookup fails */ }
  }));
  renderDay();
}

  }, err => { console.warn('dayEdit sub error', err); });

async function saveDayEdit(){

async function truncateLogSets(itemKey, newCount){

  try{ await db.collection('logs').doc(w.date+'__'+itemKey).set(body); }
  catch(e){ console.warn('truncate failed', e); }
}

async function adjustSetCount(itemKey, delta){
  const item = findItem(itemKey);
  if (!item || item.sets == null) return;
  const next = Math.max(1, item.sets + delta);
  if (next === item.sets) return;
  const setAdj = Object.assign({}, dayEdit.setAdj||{});
  setAdj[itemKey] = next;
  dayEdit.setAdj = setAdj;
  await saveDayEdit();
  if (delta < 0) await truncateLogSets(itemKey, next);
  renderDay();
}

function updateCairn(){
  const m = document.getElementById('cairnMeter'); if (!m) return;
  const btns = [...document.querySelectorAll('#main .card:not(.cardhidden) .donebtn')];
  const tot = btns.length, done = btns.filter(b => b.classList.contains('on')).length;
  const n = tot ? Math.floor(done / tot * 5 + (done === tot ? 0 : 0)) : 0;
  const lit = tot && done === tot ? 5 : Math.min(4, n);
  [...m.querySelectorAll('ellipse')].forEach((e, i) => e.classList.toggle('lit', i < lit));
  m.classList.toggle('full', !!tot && done === tot);
  m.style.visibility = view === 'today' && tot ? 'visible' : 'hidden';
}

function findItem(itemKey){
  const { all } = dayItems();
  return all.find(it => it.k === itemKey);
}

function readRowValues(row){
  const get = (f) => row.querySelector(`[data-field="${f}"]`);
  const w = get('w').value, r = get('r').value, rpe = get('rpe').value;
  return {
    w: w===''?null:Number(w),
    r: r===''?null:Number(r),
    rpe: rpe===''?null:Number(rpe),
    done: row.querySelector('.donebtn').classList.contains('on'),
  };
}
function scheduleRowSave(row, itemKey, setIdx, immediate){
  if (offline) return;
  const timerKey = itemKey+'|'+setIdx;
  clearTimeout(saveTimers[timerKey]);
  if (immediate) { commitRow(row, itemKey, setIdx); return; }
  saveTimers[timerKey] = setTimeout(() => commitRow(row, itemKey, setIdx), 400);
}
/* saves whatever the row currently shows — typed or prefilled from a prior session — so
   tapping done on an untouched prefilled row still records the numbers on screen */
async function commitRow(row, itemKey, setIdx){
  const w = WORKOUTS[curIdx];
  const item = findItem(itemKey);
  if (!item) return;
  const cur = logDoc[itemKey] || { itemKey, date:w.date, week:w.week, day:w.day, exercise:item.ex, sets:[] };
  const sets = (cur.sets || []).slice();
  while (sets.length <= setIdx) sets.push({});
  sets[setIdx] = readRowValues(row);
  const body = Object.assign({}, cur, { sets, updatedAt: new Date().toISOString() });
  logDoc[itemKey] = body;
  try{ await db.collection('logs').doc(w.date+'__'+itemKey).set(body); }
  catch(e){ console.warn('save failed', e); }
}
async function saveCheckItem(itemKey, done){
  if (offline) return;
  const w = WORKOUTS[curIdx];
  const item = findItem(itemKey);
  if (!item) return;
  const body = { itemKey, date:w.date, week:w.week, day:w.day, exercise:item.ex, done, updatedAt: new Date().toISOString() };
  logDoc[itemKey] = body;
  try{ await db.collection('logs').doc(w.date+'__'+itemKey).set(body); }
  catch(e){ console.warn('save failed', e); }
}
function scheduleCardioSave(row, itemKey){
  if (offline) return;
  clearTimeout(saveTimers[itemKey]);
  saveTimers[itemKey] = setTimeout(() => commitCardio(row, itemKey), 400);
}
async function commitCardio(row, itemKey){
  if (offline) return;
  const w = WORKOUTS[curIdx];

function drawHistory(){
  const tbody = document.querySelector('#histTable tbody');
  const canvas = document.getElementById('histCanvas');
  const empty = document.getElementById('histEmpty');
  const isCardio = isCardioName(histExercise);

  if (isCardio){
    const rows = histRows.map(doc => `<tr><td class="tabular">${fmtDate(doc.date)}</td><td class="tabular">${doc.time ?? '-'}</td><td class="tabular">${doc.dist ?? '-'}</td><td class="tabular">${doc.hr ?? '-'}</td><td class="tabular mut">${doc.incline ?? '-'}</td></tr>`);
    tbody.innerHTML = rows.join('') || `<tr><td colspan="5" class="mut" style="text-align:center;padding:16px 0;">No cardio logged yet.</td></tr>`;
    canvas.style.display = 'none';
    empty.hidden = false;
    empty.textContent = 'No chart for cardio yet — check the table below for avg HR / pace trend.';
    return;
  }

  const rows = [];
  const points = []; // {date, weight}
  histRows.forEach(doc => {
    let maxW = null;
    (doc.sets||[]).forEach((s,i) => {
      if (s.w != null || s.r != null || s.rpe != null){
        rows.push(`<tr><td class="tabular">${fmtDate(doc.date)}</td><td class="tabular">${i+1}</td><td class="tabular">${s.w ?? '-'}</td><td class="tabular">${s.r ?? '-'}</td><td class="tabular mut">${s.rpe ?? '-'}</td></tr>`);
        if (s.w != null) maxW = maxW==null ? s.w : Math.max(maxW, s.w);
      }
    });
    if (maxW != null) points.push({ date: doc.date, weight: maxW });
  });
  tbody.innerHTML = rows.join('') || `<tr><td colspan="5" class="mut" style="text-align:center;padding:16px 0;">No sets logged yet.</td></tr>`;

  points.sort((a,b) => a.date.localeCompare(b.date));
  if (points.length < 2){
    canvas.style.display = 'none';
    empty.hidden = false;
    empty.textContent = 'No logged sets yet for this exercise.';
    return;
  }
  canvas.style.display = 'block';
  empty.hidden = true;
  drawSparkline(canvas, points);
  if (!drawSparkline._resizeWired){
    drawSparkline._resizeWired = true;
    let t;
    window.addEventListener('resize', () => {
      clearTimeout(t);
      t = setTimeout(() => {
        const c = document.getElementById('histCanvas');
        if (c && c.style.display !== 'none' && histRows.length) drawHistory();
      }, 150);
    });
  }
}

function drawSparkline(canvas, points){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const W = (rect.width || 600), H = 150;
  canvas.width = W*dpr; canvas.height = H*dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const cs = getComputedStyle(document.body);
  const accent = cs.getPropertyValue('--accent').trim();
  const line = cs.getPropertyValue('--line').trim();
  const muted = cs.getPropertyValue('--muted').trim();

  const pad = {l:38, r:10, t:14, b:20};
  const ys = points.map(p=>p.weight);
  let yMin = Math.min(...ys), yMax = Math.max(...ys);
  if (yMin === yMax){ yMin -= 10; yMax += 10; }
  const yPad = (yMax-yMin)*0.12;
  yMin -= yPad; yMax += yPad;

  const x = i => pad.l + (W-pad.l-pad.r) * (i/(points.length-1));
  const y = v => pad.t + (H-pad.t-pad.b) * (1 - (v-yMin)/(yMax-yMin));

  ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.font = '11px Archivo, sans-serif'; ctx.fillStyle = muted;
  [yMin, (yMin+yMax)/2, yMax].forEach(v => {
    const yy = y(v);
    ctx.beginPath(); ctx.moveTo(pad.l, yy); ctx.lineTo(W-pad.r, yy); ctx.stroke();
    ctx.fillText(Math.round(v)+'', 2, yy+4);
  });

  ctx.beginPath();
  points.forEach((p,i) => { const xx=x(i), yy=y(p.weight); i===0?ctx.moveTo(xx,yy):ctx.lineTo(xx,yy); });
  ctx.strokeStyle = accent; ctx.lineWidth = 2; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.stroke();

  const last = points[points.length-1];
  ctx.beginPath(); ctx.arc(x(points.length-1), y(last.weight), 4, 0, Math.PI*2);
  ctx.fillStyle = accent; ctx.fill();

  const tip = document.getElementById('histTip');
  canvas.onmousemove = canvas.ontouchmove = (e) => {
    const evt = e.touches ? e.touches[0] : e;
    const r = canvas.getBoundingClientRect();
    const mx = evt.clientX - r.left;
    let closest = 0, best = Infinity;
    points.forEach((p,i) => { const d = Math.abs(x(i)-mx); if (d<best){best=d; closest=i;} });
    const p = points[closest];
    tip.style.display='block';
    tip.style.left = x(closest)+'px';
    tip.style.top = y(p.weight)+'px';
    tip.textContent = `${fmtDate(p.date)} · ${p.weight} lb`;
  };
  canvas.onmouseleave = () => { tip.style.display='none'; };
}

function parseBenchVal(kind, s){
  if (s==null) return null;
  s = String(s).trim();
  if (s==='') return null;
  if (kind==='time' && s.indexOf(':')>-1){
    const p = s.split(':');
    const m = Number(p[0]), sec = Number(p[1]);
    if (isNaN(m) || isNaN(sec)) return null;
    return m*60 + sec;
  }
  const n = Number(s);
  if (isNaN(n)) return null;
  return kind==='time' ? n*60 : n;
}
function fmtSecs(t){
  const sign = t<0 ? '-' : '+';
  t = Math.abs(Math.round(t));
  return sign + Math.floor(t/60) + ':' + pad(t%60);
}
function benchChange(test){
  const rec = bench.tests[test.id] || {};
  const a = parseBenchVal(test.kind, rec.w1), b = parseBenchVal(test.kind, rec.w12);
  if (a==null || b==null) return { txt:'-', cls:'' };
  const d = b - a;
  if (d === 0) return { txt:'0', cls:'' };
  const good = test.better==='higher' ? d>0 : d<0;
  const txt = test.kind==='time' ? fmtSecs(d) : ((d>0?'+':'') + (Math.round(d*100)/100));
  return { txt, cls: good ? 'up' : 'down' };
}
function zoneText(){
  const age = Number(bench.age);
  if (!age || age<10 || age>100) return { max:'-', zone:'-' };
  const mx = Math.round(220 - age);
  return { max: mx + ' bpm', zone: Math.round(mx*0.6) + '-' + Math.round(mx*0.7) + ' bpm' };
}

let readyDoc = null, unsubReady = null, readyEditing = false, readyChain = Promise.resolve();
function pts(list, v){ const r = list.find(x => x[0]===v); return r ? r[2] : null; }

  if (!d) return null;

  let level = 'green';

  else if (score<=4 || d.pain==='mild') level = 'yellow';
  return { score, level };
}

function swapOptions(){

let sessionDoc = null, unsubSession = null;

function finishBarHtml(){
  if (offline) return '';
  const { all } = dayItems();
  if (!all.some(it => it.sets!=null && !it.hidden && !isWarm(it.ex))) return '';
  const fin = !!(sessionDoc && sessionDoc.finishedAt);
  return `<button class="savebtn finishbtn" id="finishBtn">${fin ? 'View recap' : 'Finish workout'}</button>`;
}
function computeRecap(){
  const { all } = dayItems();
  const muscles = {}; let sets = 0, vol = 0, top = null; const extras = [];
  all.forEach(it => {
    if (it.hidden) return;
    const log = logDoc[it.k];
    if (!log) return;
    const ms = musclesFor(it);
    if (it.sets!=null && log.sets){
      if (isWarm(it.ex)) return;
      const done = log.sets.filter(s => s && s.done);
      if (!done.length) return;
      sets += done.length;
      done.forEach(s => {
        const r = Number(s.r);
        if (s.w!=null && !isNaN(r) && s.r!=null){
          vol += s.w*r;
          const e1 = s.w*(1+r/30);
          if (!top || e1>top.e1) top = { ex: it.ex, w: s.w, r: r, e1: Math.round(e1) };
        }
      });
      ms.forEach(m => { if (m!=='Mobility' && m!=='Cardio') muscles[m] = (muscles[m]||0) + done.length; });
    } else if (log.done || log.time!=null){
      if (/zone 2/i.test(it.ex)) extras.push('Zone 2' + (log.time ? ' · '+log.time+' min' : ''));
      else extras.push(it.ex.replace(/\s*\(.*?\)\s*/g,' ').trim());
    }
  });
  return { muscles, sets, vol: Math.round(vol), top, extras };
}

/* ---- plate math: tap a barbell weight to see what to load ---- */
const ALL_PLATES = [100,55,45,35,25,15,10,5,2.5,1.25];
const PLATE_COLOR = { 100:'#B3382C', 55:'#B3382C', 45:'#E0A233', 35:'#6FA3E0', 25:'#6FA96B', 15:'#C9C2B2', 10:'#9C9588', 5:'#8A8478', 2.5:'#756F64', 1.25:'#6E6A61' };
function platesFor(total){
  const bar = Number(settings.bar) || 45;
  const avail = (settings.plates || []).map(Number).sort((a,b) => b-a);
  let side = (total - bar) / 2;
  if (side < 0) return { bar, empty:true, list:[], per:0, off:0 };
  const list = []; let rem = side;
  avail.forEach(p => { const n = Math.floor((rem + 1e-9) / p); if (n > 0){ list.push([p, n]); rem -= n*p; } });
  const loaded = bar + 2*(side - rem);
  return { bar, list, per:side - rem, off: Math.round((total - loaded)*100)/100, loaded };
}
function platesSheet(total, choices){
  const r = platesFor(total);
  const bar = r.bar;
  const viz = r.list.flatMap(([p,n]) => Array.from({length:n}, () => p)).map(p => {
    const h = Math.round(34 + Math.min(p,45)/45*62), w = p >= 25 ? 16 : p >= 10 ? 12 : 8;
    return `<div class="pl" style="width:${w}px;height:${h}px;background:${PLATE_COLOR[p]||'#888'}"><span>${p}</span></div>`;
  }).join('');
  const rows = r.list.map(([p,n]) => `<div class="prow"><span>${p} lb plate</span><b>${n} each side</b></div>`).join('');
  const body = r.empty ? `<div class="notes">That is lighter than the ${bar} lb bar.</div>`
    : `<div class="platebar"><div class="sleeve" style="width:16px"></div><div class="shaft"></div><div class="pstack">${viz}</div><div class="sleeve"></div></div>
       <div class="plist">${rows || '<div class="notes">Just the bar.</div>'}</div>
       <div class="notes">${r.off ? `Closest you can load with your plates is ${r.loaded} lb (${Math.abs(r.off)} lb ${r.off>0?'short':'over'}). ` : ''}${r.per} lb per side, ${bar} lb bar.</div>`;
  const chips = choices.length > 1 ? `<div class="rareas">${choices.map(c => `<button class="mpick ${c===total?'on':''}" data-pw="${c}">${c}</button>`).join('')}</div>` : '';
  return `<div class="plhead"><h2 style="font-size:26px;">Load ${total} lb</h2><button class="ghostbtn" id="plClose">Close</button></div>${body}${chips}`;
}
function openPlates(total, choices){
  openSheet(platesSheet(total, choices));
  const wire = () => {
    const c = document.getElementById('plClose'); if (c) c.onclick = closeSheet;
    document.querySelectorAll('[data-pw]').forEach(b => b.onclick = () => { const el = document.getElementById('sheet').querySelector('.sheetin'); el.innerHTML = platesSheet(Number(b.dataset.pw), choices); wire(); });
  };
  wire();
}
document.addEventListener('click', (e) => {

let exNotes = {}, exNoteEditing = null;
const noteKey = (ex) => String(ex||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,80);
function watchExNotes(){
  if (!db) return;
  try{
    db.collection('exnotes').limit(400).onSnapshot(snap => {
      exNotes = {}; snap.docs.forEach(d => { const x = d.data(); if (x && x.text) exNotes[d.id] = x; });
      if (view==='today' && !exNoteEditing) renderDay();
    }, err => console.warn('notes sub error', err));
  }catch(e){ console.warn(e); }
}
function exNoteHtml(ex){
  if (offline) return '';
  const k = noteKey(ex), n = exNotes[k];
  if (exNoteEditing === k) return `<div class="notebox"><textarea id="noteText" rows="3" placeholder="Cues, setup, what to watch for">${esc(n ? n.text : '')}</textarea><div class="rbtns"><button class="savebtn" id="noteSave" style="flex:none;padding:10px 16px;min-height:42px;font-size:14px;">Save note</button><button class="ghostbtn" id="noteCancel">Cancel</button></div></div>`;
  return n ? `<button class="mynote" data-notebtn="${k}"><span>${esc(n.text)}</span></button>` : `<button class="ghostbtn notebtn" data-notebtn="${k}">+ Note</button>`;
}
function wireNotes(){
  const main = document.getElementById('main');
  main.querySelectorAll('[data-notebtn]').forEach(b => b.onclick = () => { exNoteEditing = b.dataset.notebtn; renderDay(); const ta = document.getElementById('noteText'); if (ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } });
  const c = document.getElementById('noteCancel'); if (c) c.onclick = () => { exNoteEditing = null; renderDay(); };
  const s = document.getElementById('noteSave'); if (s) s.onclick = async () => {
    const k = exNoteEditing, text = document.getElementById('noteText').value.trim();
    const ex = (dayItems().all.find(it => noteKey(it.ex) === k) || {}).ex || k;
    exNoteEditing = null;
    if (text) exNotes[k] = { ex, text }; else delete exNotes[k];
    try{ if (text) await db.doc('exnotes/'+k).set({ ex, text, updatedAt:new Date().toISOString() }); else await db.doc('exnotes/'+k).delete(); }catch(e){ console.warn('note save failed', e); }
    renderDay();
  };
}
function wireToday(){

/* ================= REST TIMER ================= */
let restT = null, restInt = null;
function parseRestSec(s){
  if (!s || s==='-') return null;
  const m = String(s).match(/(\d+)(?:\s*-\s*(\d+))?\s*(sec|min)/i);
  if (!m) return null;
  const a = Number(m[1]);
  return m[3].toLowerCase()==='min' ? a*60 : a;
}
function fmtClock(sec){ sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec/60)+':'+pad(sec%60); }
function startRest(key){
  if (!settings.timer) return;
  const it = findItem(key);
  if (!it || isWarm(it.ex)) return;
  const sec = parseRestSec(it.rest);
  if (!sec) return;
  primeBeep();
  restT = { end: Date.now()+sec*1000, total: sec, label: it.ex.replace(/\s*\((PRIMARY|secondary)\)/,''), fired:false };
  if (!restInt) restInt = setInterval(tickRest, 250);
  tickRest();
}
/* iPhone silent switch: Web Audio is muted by it, but an audio element on the "playback" channel is not.
   The element must be unlocked by a tap, so we prime it when the rest timer starts (that start comes from tapping a set). */
let beepEl = null;
function beepSrc(){
  const sr = 8000, n = Math.floor(sr*0.5), buf = new ArrayBuffer(44 + n*2), v = new DataView(buf);
  const w = (o,s) => { for (let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,n*2,true);
  for (let i=0;i<n;i++){ const t = i/sr, on = (t<0.16) || (t>0.26 && t<0.42); const env = on ? Math.min(1, (t<0.26 ? t : t-0.26)*60) : 0; v.setInt16(44+i*2, Math.sin(2*Math.PI*880*t)*env*26000, true); }
  let s = ''; const u = new Uint8Array(buf); for (let i=0;i<u.length;i++) s += String.fromCharCode(u[i]);
  return 'data:audio/wav;base64,' + btoa(s);
}
function primeBeep(){
  if (!settings.sound) return;
  try{
    if (!beepEl){ beepEl = new Audio(beepSrc()); beepEl.preload = 'auto'; }
    beepEl.muted = true; const p = beepEl.play();
    const done = () => { try{ beepEl.pause(); beepEl.currentTime = 0; beepEl.muted = false; }catch(e){} };
    if (p && p.then) p.then(done).catch(() => {}); else done();
  }catch(e){}
}
function alertRest(){
  try{ if (navigator.vibrate) navigator.vibrate([140,70,140]); }catch(e){}
  if (!settings.sound) return;
  try{
    if (beepEl){
      try{ if (navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){}
      beepEl.muted = false; beepEl.volume = 1; beepEl.currentTime = 0;
      const p = beepEl.play();
      beepEl.onended = () => { try{ if (navigator.audioSession) navigator.audioSession.type = 'auto'; }catch(e){} };
      if (p && p.then){ p.catch(() => alertRestWeb()); }
      return;
    }
  }catch(e){}
  alertRestWeb();
}
function alertRestWeb(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = new AC(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.frequency.value = 880; g.gain.value = 0.08;
    o.start(); o.stop(c.currentTime+0.2);
    setTimeout(() => { try{ c.close(); }catch(e){} }, 500);
  }catch(e){}
}
function tickRest(){
  const bar = document.getElementById('restbar');
  if (!bar) return;
  if (!restT){
    bar.hidden = true; bar.classList.remove('go');
    document.body.classList.remove('restshown');
    if (restInt){ clearInterval(restInt); restInt = null; }
    return;
  }
  const left = (restT.end-Date.now())/1000;
  bar.hidden = false;
  document.body.classList.add('restshown');
  document.getElementById('rLabel').textContent = restT.label;
  if (left<=0){
    if (!restT.fired){ restT.fired = true; restT.doneAt = Date.now(); alertRest(); }
    bar.classList.add('go');
    document.getElementById('rTime').textContent = 'Go';
    document.getElementById('rFill').style.width = '100%';
    if (Date.now()-restT.doneAt > 6000){ restT = null; tickRest(); }
    return;
  }
  bar.classList.remove('go');
  document.getElementById('rTime').textContent = fmtClock(left);
  document.getElementById('rFill').style.width = Math.max(0, Math.min(100, (1-left/restT.total)*100))+'%';
}

function muscleMapSvg(counts){
  const vals = Object.values(counts||{});
  const max = Math.max(1, ...vals);
  const paint = (g) => {
    const n = g ? ((counts||{})[g] || 0) : 0;
    return n>0 ? `fill="var(--accent)" fill-opacity="${(0.35+0.65*n/max).toFixed(2)}"` : `fill="var(--surface2)"`;
  };
  /* round every corner of the polygon with a small curve so the figure reads as a body, not a paper cutout */
  const soft = (p, r) => {
    const nums = p.trim().split(/[\s,]+/).map(Number), pts = []; for (let i=0;i+1<nums.length;i+=2) pts.push([nums[i], nums[i+1]]); const n = pts.length;
    if (n < 3) return '';
    const mid = (a, b, d) => { const dx = b[0]-a[0], dy = b[1]-a[1], len = Math.hypot(dx, dy) || 1, k = Math.min(r, len/2) / len; return [a[0]+dx*k*(d?1:0)+(d?0:dx*(1-k)), a[1]+dy*k*(d?1:0)+(d?0:dy*(1-k))]; };
    let out = '';
    for (let i=0;i<n;i++){
      const prev = pts[(i+n-1)%n], cur = pts[i], next = pts[(i+1)%n];
      const s = mid(cur, prev, true), e = mid(cur, next, true);
      out += (i ? 'L' : 'M') + s[0].toFixed(1)+','+s[1].toFixed(1) + 'Q' + cur[0]+','+cur[1]+' '+e[0].toFixed(1)+','+e[1].toFixed(1);
    }
    return out + 'Z';
  };
  const fig = (list) => list.map(([g,p]) => `<path d="${soft(p, 3.2)}" ${paint(g)} stroke="var(--bg)" stroke-width="0.5" stroke-linejoin="round"/>`).join('');
  return `<svg class="mmap" viewBox="0 0 215 214" role="img" aria-label="Muscle map, front and back">
    <g>${fig(BODY_PARTS.ant)}</g><g transform="translate(115,0)">${fig(BODY_PARTS.post)}</g>
    <text x="50" y="211" text-anchor="middle" class="mmlab">FRONT</text><text x="165" y="211" text-anchor="middle" class="mmlab">BACK</text></svg>`;
}

  }));
  const done = {}; let cardioMin = 0, mobDone = 0;
  const token = ++volToken;

    try{
      const start = days[0].date, end = days[days.length-1].date;
      const snap = await db.collection('logs').where('date','>=',start).orderBy('date','asc').limit(500).get();
      snap.docs.forEach(d => {
        const x = d.data();
        if (!x || x.date>end) return;
        const ms = MUSCLE_MAP[x.exercise] || [];
        if (x.sets && !isWarm(x.exercise)){
          const n = x.sets.filter(s => s && s.done).length;
          ms.forEach(m => { done[m] = (done[m]||0) + n; });
        } else if (/zone 2/i.test(x.exercise||'')){
          if (x.time) cardioMin += Number(x.time)||0;
        } else if (x.done && ms.indexOf('Mobility')>-1){ mobDone++; }
      });
    }catch(e){ console.warn('volume load failed', e); }
  }
  if (token!==volToken || curSub()!=='volume' || view!=='progress') return;
  const rows = VOL_MUSCLES.filter(m => (planned[m]||0)>0 || (done[m]||0)>0).map(m => {
    const p = planned[m]||0, d = done[m]||0, top = Math.max(p,d,1);
    return `<div class="mbar"><div>${m}</div><div class="mtrack"><div class="mplan" style="width:${Math.round(p/top*100)}%"></div><div class="mfill ${d>=p&&p>0?'full':''}" style="width:${Math.round(d/top*100)}%"></div></div><div class="tabular" style="text-align:right">${d}/${p}</div></div>`;
  }).join('');
  document.getElementById('volBody').innerHTML = `
    ${muscleMapSvg(done)}
    <div style="display:flex;flex-direction:column;gap:9px;">${rows || '<div class="notes">Nothing planned this week.</div>'}</div>
    <div class="chips" style="margin-top:10px;"><span class="chip">Zone 2 · ${cardioMin} min</span><span class="chip">Mobility sessions · ${mobDone}</span></div>`;
}

  const rows = days.map(w => {
    const p = perDay[w.date], sk = skipsMap[w.date];

    const bar = p ? `<div class="mtrack"><div class="mfill" style="width:${Math.max(4, Math.round(p.lb/maxLb*100))}%"></div></div>` : `<div class="mtrack"></div>`;
    const right = p ? `<b class="tabular">${fmtLb(p.lb)}</b> lb` : (sk ? 'skipped' : (w.date > todayStr() ? '' : '-'));
    const det = p ? `<div class="wkdet">${p.ex.sort((a,b) => b.lb - a.lb).slice(0,4).map(e => `<span>${esc(e.name.replace(/\s*\(.*\)/,''))} ${fmtLb(e.lb)}</span>`).join('')}</div>` : '';

    : lows >= 3 ? `${lows} of this week's check-ins were yellow or red. A deload week would be reasonable.`
    : (delta != null && delta <= -25 && trained >= 2) ? 'Weight lifted dropped a lot from last week. If that was not planned, check sleep and recovery.'

    <div class="card"><div class="exname">By workout</div>${rows}</div>

  const bd = document.getElementById('wkDeload'); if (bd) bd.onclick = () => setDeload(true);

let weightRows = [];
function drawLine(canvas, tip, series){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const W = rect.width || 600, H = 170;
  canvas.width = W*dpr; canvas.height = H*dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const cs = getComputedStyle(document.body);
  const accent = cs.getPropertyValue('--accent').trim(), line = cs.getPropertyValue('--line').trim(), muted = cs.getPropertyValue('--muted').trim();
  const all = [].concat.apply([], series.map(s => s.points));
  const ts = d => new Date(d+'T12:00:00').getTime();
  let t0 = Math.min.apply(null, all.map(p => ts(p.date))), t1 = Math.max.apply(null, all.map(p => ts(p.date)));
  if (t0===t1) t1 = t0+86400000;
  let yMin = Math.min.apply(null, all.map(p => p.v)), yMax = Math.max.apply(null, all.map(p => p.v));
  if (yMin===yMax){ yMin -= 2; yMax += 2; }
  const yPad = (yMax-yMin)*0.15; yMin -= yPad; yMax += yPad;
  const pad_ = { l:40, r:10, t:12, b:22 };
  const x = d => pad_.l + (W-pad_.l-pad_.r) * ((ts(d)-t0)/(t1-t0));
  const y = v => pad_.t + (H-pad_.t-pad_.b) * (1-(v-yMin)/(yMax-yMin));
  ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.font = '11px Archivo, sans-serif'; ctx.fillStyle = muted;
  [yMin, (yMin+yMax)/2, yMax].forEach(v => {
    const yy = y(v);
    ctx.beginPath(); ctx.moveTo(pad_.l, yy); ctx.lineTo(W-pad_.r, yy); ctx.stroke();
    ctx.fillText((Math.round(v*10)/10)+'', 2, yy+4);
  });
  const pts0 = series[0].points;
  ctx.textAlign = 'left'; ctx.fillText(fmtDate(pts0[0].date), pad_.l, H-5);
  ctx.textAlign = 'right'; ctx.fillText(fmtDate(pts0[pts0.length-1].date), W-pad_.r, H-5); ctx.textAlign = 'left';
  series.forEach(s => {
    if (s.line){
      ctx.beginPath();
      s.points.forEach((p,i) => { const xx = x(p.date), yy = y(p.v); i===0 ? ctx.moveTo(xx,yy) : ctx.lineTo(xx,yy); });
      ctx.strokeStyle = accent; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
    }
    if (s.dots){
      ctx.fillStyle = muted;
      s.points.forEach(p => { ctx.beginPath(); ctx.arc(x(p.date), y(p.v), 2.5, 0, Math.PI*2); ctx.fill(); });
    }
  });
  const hit = (e) => {
    const evt = e.touches ? e.touches[0] : e;
    const r = canvas.getBoundingClientRect();
    const mx = evt.clientX - r.left;
    let best = Infinity, bp = null;
    pts0.forEach(p => { const d = Math.abs(x(p.date)-mx); if (d<best){ best = d; bp = p; } });
    if (!bp) return;
    tip.style.display = 'block';
    tip.style.left = x(bp.date)+'px';
    tip.style.top = y(bp.v)+'px';
    tip.textContent = `${fmtDate(bp.date)} · ${bp.v} lb`;
  };
  canvas.onmousemove = canvas.ontouchmove = canvas.ontouchstart = hit;
  canvas.onmouseleave = () => { tip.style.display = 'none'; };
}
function weightStats(asc){
  const avgAt = i => { const sl = asc.slice(Math.max(0,i-6), i+1); return sl.reduce((a,b) => a+b.lb, 0)/sl.length; };
  const trend = asc.map((r,i) => ({ date:r.date, v: Math.round(avgAt(i)*10)/10 }));
  const latest = asc[asc.length-1];
  let change = null;
  const cutoff = dateStrAgo(28);
  let ref = null;
  asc.forEach((r,i) => { if (r.date<=cutoff) ref = i; });
  if (ref!=null) change = Math.round((avgAt(asc.length-1)-avgAt(ref))*10)/10;
  return { trend, latest, avg: Math.round(avgAt(asc.length-1)*10)/10, change };
}

  const asc = weightRows.slice().sort((a,b) => a.date.localeCompare(b.date));
  const stats = document.getElementById('bwStats');
  const canvas = document.getElementById('bwCanvas'), empty = document.getElementById('bwEmpty'), tip = document.getElementById('bwTip');
  if (!stats) return;
  if (asc.length){
    const s = weightStats(asc);
    stats.innerHTML = `

      <div class="stat"><div class="sv tabular">${s.avg}</div><div class="sl">7-entry avg</div></div>
      <div class="stat"><div class="sv tabular">${s.change==null?'-':(s.change>0?'+':'')+s.change}</div><div class="sl">Last 4 weeks</div></div>`;
    if (asc.length>=2){
      canvas.style.display = 'block'; empty.hidden = true;
      drawLine(canvas, tip, [{ points: asc.map(r => ({date:r.date, v:r.lb})), dots:true }, { points: s.trend, line:true }]);

async function saveWeight(){

  const lb = Number(v);

  try{ await db.collection('bodyweight').doc(date).set(body); }catch(e){ console.warn('save weight failed', e); return; }
  weightRows = weightRows.filter(r => r.date!==date).concat([body]).sort((a,b) => b.date.localeCompare(a.date));

    try{ await db.doc('state/maxes').set(Object.assign({}, maxes, { bodyweight: lb, updatedAt: new Date().toISOString() })); }catch(e){ console.warn(e); }

  { id:'ocr', name:'Obstacle / climbing', f:['reps','time'], u:{reps:'reps',time:'min'} },
  { id:'cond', name:'Conditioning (bike, row, intervals)', f:['dist','time'], u:{dist:'mi',time:'min'} },

}
function funcLastHtml(){

async function saveSkip(){

function renderSkips(){
  const main = mainEl();
  if (offline || !db){ main.innerHTML = offlineNote(); return; }

}
function drawSkips(){
  if (curSub()!=='skips' || view!=='progress') return;
  const stats = document.getElementById('skStats'), list = document.getElementById('skList');
  if (!stats || !list) return;
  const today = todayStr();
  const rows = Object.values(skipsMap).sort((a,b) => b.date.localeCompare(a.date));
  const planned = WORKOUTS.filter(w => !w.synthetic && w.date <= today && w.items.some(it => it.sets!=null && !it.plan)).length;
  const past = rows.filter(r => r.date <= today);
  const last28 = past.filter(r => r.date >= dateStrAgo(27)).length;
  if (!rows.length){ stats.innerHTML = ''; list.innerHTML = '<div class="notes">Nothing skipped. Nice.</div>'; return; }
  const by = (key) => { const o = {}; past.forEach(r => { const k = r[key] || 'Other'; o[k] = (o[k]||0)+1; }); return Object.entries(o).sort((a,b) => b[1]-a[1]); };
  const reasons = by('reason'), days = by('day');
  const max = Math.max(1, reasons[0] ? reasons[0][1] : 1);
  const bar = (k,n,mx) => `<div class="mbar"><div>${esc(k)}</div><div style="background:var(--surface2);border-radius:6px;height:10px;"><div style="width:${Math.round(n/mx*100)}%;height:10px;border-radius:6px;background:var(--accent);"></div></div><div class="tabular">${n}</div></div>`;
  let insight = '';
  if (past.length>=3){
    const [r0,n0] = reasons[0], [d0,m0] = days[0];
    insight = `${n0} of ${past.length} skips were for "${r0}".` + (m0>=3 && m0/past.length>=0.4 ? ` ${d0} is the day that gets skipped most (${m0}).` : '');
  }
  stats.innerHTML = `
    <div class="statrow">
      <div class="stat"><div class="sv tabular">${past.length}</div><div class="sl">Skipped</div></div>
      <div class="stat"><div class="sv tabular">${planned ? Math.round(past.length/planned*100)+'%' : '-'}</div><div class="sl">Of ${planned} planned</div></div>
      <div class="stat"><div class="sv tabular">${last28}</div><div class="sl">Last 4 weeks</div></div>
    </div>
    ${insight ? `<div class="notes">${esc(insight)}</div>` : ''}
    <div class="card"><div class="exname">Why</div>${reasons.map(([k,n]) => bar(k,n,max)).join('')}</div>
    <div class="card"><div class="exname">Which day</div>${days.map(([k,n]) => bar(k,n,max)).join('')}</div>`;
  list.innerHTML = rows.slice(0,40).map(r => `
    <div class="card" style="padding:10px 14px;">
      <div class="exhead"><div class="exname">${esc(r.reason)} · ${esc(r.day||'')} wk ${r.week||'-'}</div><button class="ghostbtn" data-delsk="${esc(r.date)}" aria-label="Remove skip">&times;</button></div>
      <div class="notes">${fmtDate(r.date)}${r.focus ? ' · '+esc(r.focus) : ''}${r.note ? ' · '+esc(r.note) : ''}</div>
    </div>`).join('');
  list.querySelectorAll('[data-delsk]').forEach(b => b.onclick = async () => {
    try{ await db.doc('skips/'+b.dataset.delsk).delete(); }catch(e){ console.warn(e); }
    delete skipsMap[b.dataset.delsk]; drawSkips();
  });
}

/* ================= BENCH STICKING POINT ================= */
const STICK_RE = /spoto|pin press|board press/i;
let stickRows = [], stickHeights = {}, stickBench = [];
async function renderSticking(){
  const main = mainEl();
  if (offline || !db){ main.innerHTML = offlineNote(); return; }
  main.innerHTML = `
    <div class="notes">Your stall is 1 to 3 inches off the chest. Spoto presses train that range. After each Spoto session, tag the gap where it got sticky, and watch whether the weight there climbs.</div>

    <div id="stNote"></div>
    <div id="stList"></div>`;
  try{
    const snap = await db.collection('logs').orderBy('date','desc').limit(500).get();
    const per = {}; stickBench = []; const benchBy = {};
    snap.docs.forEach(d => {
      const x = d.data(); if (!x || !x.exercise || !Array.isArray(x.sets)) return;
      const done = x.sets.filter(s => s && s.done && Number(s.w)>0 && Number(s.r)>0);

      if (STICK_RE.test(x.exercise)){

function liftFamily(ex){
  if (/squat|leg press|lunge|split/i.test(ex)) return 'Squat';
  if (/deadlift|rdl|romanian|good ?morning|trap bar/i.test(ex)) return 'Deadlift';
  if (/bench|press|spoto|ohp|dip|push/i.test(ex)) return 'Pressing';
  if (/jump|bound|plyo|hop/i.test(ex)) return 'Jumps';
  if (/pull|row|curl|lat /i.test(ex)) return 'Pulling';
  return null;
}
async function flareContext(){
  const ctx = { lifts: [] };
  const snap = await db.collection('logs').where('date','>=',dateStrAgo(2)).get();
  snap.docs.forEach(d => {
    const x = d.data(); if (!x || !x.exercise || isWarm(x.exercise) || !Array.isArray(x.sets)) return;
    const done = x.sets.filter(s => s && s.done);
    if (!done.length) return;
    const top = Math.max(0, ...done.map(s => Number(s.w)||0));
    ctx.lifts.push({ date:x.date, ex:x.exercise.replace(/\s*\(.*\)/,''), sets:done.length, top, fam: liftFamily(x.exercise) });
  });
  ctx.lifts.sort((a,b) => b.date.localeCompare(a.date) || b.top - a.top);
  ctx.lifts = ctx.lifts.slice(0,12);
  const rd = (ds) => (ds===todayStr() && readyDoc) ? readyDoc : readyWeek[ds];
  const r0 = rd(todayStr()), r1 = rd(dateStrAgo(1));
  ctx.sleepToday = r0 ? r0.sleep || null : null;
  ctx.sleepPrev = r1 ? r1.sleep || null : null;
  ctx.level = (r0 && r0.level) || null;
  return ctx;
}
function flareCtxLine(r){

  const mains = c.lifts.filter(l => l.fam).slice(0,3);
  const days = (d) => { const n = Math.round((new Date(r.date+'T12:00:00') - new Date(d+'T12:00:00'))/86400000); return n<=0 ? 'same day' : n===1 ? 'day before' : n+' days before'; };
  const txt = mains.map(l => `${esc(l.ex)}${l.top ? ' '+l.top : ''} (${l.sets} sets, ${days(l.date)})`).join(', ');
  return txt ? `<div class="notes">Before this: ${txt}</div>` : '';
}
function flarePatternsHtml(){

  const lines = [];
  const areas = {}; rows.forEach(r => { (areas[r.area] = areas[r.area] || []).push(r); });
  Object.entries(areas).forEach(([area, rs]) => {

    const fam = {}; rs.forEach(r => { const s = new Set(r.context.lifts.map(l => l.fam).filter(Boolean)); s.forEach(f => fam[f] = (fam[f]||0)+1); });
    Object.entries(fam).sort((a,b) => b[1]-a[1]).slice(0,1).forEach(([f,n]) => { if (n>=3 && n/rs.length>=0.6) lines.push(`${area}: ${n} of ${rs.length} flares came within 2 days of ${f.toLowerCase()} work.`); });

const MAIN_RE = /^(Squat|Bench|Deadlift)( Press)?( \(PRIMARY\)| — attempt)/;
const LIFT_LABEL = { squat:'Squat', bench:'Bench', deadlift:'Deadlift' };
function mainLiftOf(ex){ const m = MAIN_RE.exec(ex||''); return m ? m[1].toLowerCase() : null; }
function epley(w, r){ return r<=1 ? w : w*(1+r/30); }
function lbl(n){ return Number(n).toLocaleString(); }

/* ---- progression suggestion (shown in the workout recap; suggestion only) ---- */
function progKey(date, lift){ return 'cairn_prog_' + date + '_' + lift; }
function progressionSuggestions(){
  const w = WORKOUTS[curIdx]; const out = [];
  const { all } = dayItems();
  all.forEach(it => {
    if (it.hidden || !it.lift || !/PRIMARY/.test(it.ex) || !it.sets) return;
    const log = logDoc[it.k]; if (!log || !log.sets) return;
    const done = log.sets.filter(s => s && s.done && Number(s.r) > 0);
    if (!done.length) return;
    const lift = it.lift, name = LIFT_LABEL[lift] || it.ex;
    const tgtReps = Number(it.reps), tgtRpe = parseFloat(it.rpe);
    const rpes = done.map(s => Number(s.rpe)).filter(x => isFinite(x) && x > 0);
    const avg = rpes.length ? rpes.reduce((a,b) => a+b, 0) / rpes.length : null;
    const hit = done.length >= it.sets && (!isNaN(tgtReps) ? done.every(s => Number(s.r) >= tgtReps) : true);
    let dismissed = false; try{ dismissed = !!localStorage.getItem(progKey(w.date, lift)); }catch(e){}
    if (dismissed) return;
    const cur = maxes[lift];
    let s = null;
    if (!hit){
      s = { kind:'hold', text:`${name}: not all prescribed reps were hit. Repeat this weight before adding anything.` };
    } else if (avg == null || isNaN(tgtRpe)){
      s = { kind:'info', text:`${name}: every rep was hit. Log RPE on the main sets and I can say whether to move up.` };
    } else {
      const d = avg - tgtRpe;
      if (d <= -0.5 && cur){
        const inc = d <= -1.5 ? (lift==='bench' ? 5 : 10) : 5;
        const nm = Math.min(cur + inc, Math.floor(cur * 1.03 / 5) * 5);
        if (nm > cur) s = { kind:'up', lift, newMax:nm, text:`${name}: RPE ${avg.toFixed(1)} against a target of ${tgtRpe}. That's easier than planned. You could nudge your ${name.toLowerCase()} max from ${cur} to ${nm}.` };
      }
      if (!s && d >= 1) s = { kind:'down', text:`${name}: RPE ${avg.toFixed(1)} against a target of ${tgtRpe}. Harder than planned. Hold your max, and think about taking a set or 5% off next session.` };
      if (!s) s = { kind:'ok', text:`${name}: RPE ${avg.toFixed(1)} against a target of ${tgtRpe}. Right on plan. Keep the max where it is.` };
    }
    s.lift = lift; s.date = w.date; out.push(s);
  });
  return out;
}
function progressionHtml(){
  const list = progressionSuggestions();
  if (!list.length) return '';
  return `<div><div class="jlabel">Next time</div><div style="display:flex;flex-direction:column;gap:8px;margin-top:6px;">${list.map(s => `

}

      });

function strStats(lift){
  const per = strData && strData[lift] ? strData[lift] : {};
  const pts = Object.keys(per).filter(k => k!=='__sets').sort().map(k => per[k]);
  const sets = per.__sets || [];
  const prs = {}; [1,2,3,5].forEach(n => { let b = null; sets.forEach(s => { if (s.r >= n && (!b || s.w > b.w)) b = s; }); if (b) prs[n] = b; });
  const bestE = pts.length ? pts.reduce((a,p) => p.e > a.e ? p : a) : null;
  // trend: last 8 weeks, least squares on e1RM by day
  const cut = dateStrAgo(56); const recent = pts.filter(p => p.date >= cut);
  let slopeWk = null;
  if (recent.length >= 4){
    const t0 = new Date(recent[0].date+'T12:00:00').getTime();
    const xs = recent.map(p => (new Date(p.date+'T12:00:00').getTime() - t0) / 86400000), ys = recent.map(p => p.e);
    if (xs[xs.length-1] >= 14){
      const n = xs.length, mx = xs.reduce((a,b)=>a+b,0)/n, my = ys.reduce((a,b)=>a+b,0)/n;
      let nu = 0, de = 0; xs.forEach((x,i) => { nu += (x-mx)*(ys[i]-my); de += (x-mx)*(x-mx); });
      if (de > 0) slopeWk = nu/de*7;
    }
  }
  return { pts, prs, bestE, slopeWk };
}

function mondayOnOrAfter(ds){
  const d = new Date(ds+'T12:00:00'); const dow = (d.getDay()+6)%7; if (dow) d.setDate(d.getDate()+7-dow);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function addDaysStr(ds, n){ const d = new Date(ds+'T12:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function buildRun(plan, start, opt, km){
  const runId = 'r' + Date.now().toString(36);
  const sessions = [];
  for (let w=1; w<=plan.weeks; w++){
    const ctx = { w, weeks:plan.weeks, km: km || 10, days: opt };
    let list = plan.sessions(ctx);
    if (plan.pick === 'days') list = list.slice().sort((a,b) => a.prio-b.prio).slice(0, opt);
    else if (plan.pick === 'extras') list = list.slice().sort((a,b) => a.prio-b.prio).slice(0, opt);
    list.sort((a,b) => a.dow-b.dow).forEach(s => {
      const date = addDaysStr(start, (w-1)*7 + s.dow);
      sessions.push({ date, week:w, dow:DOW[(new Date(date+'T12:00:00').getDay()+6)%7], focus:s.focus,
        items: s.items.map((it,i) => Object.assign({ k:`p${runId}-${date}-${i}`, raw: it.raw || (it.sets ? `${it.sets}x${it.reps}` : null), lift:null, pct:null, tw:null, plan:true, runId }, it, { raw: it.raw || (it.sets ? `${it.sets}x${it.reps}` : null) })) });
    });
  }
  const end = addDaysStr(start, plan.weeks*7 - 1);
  return { id:runId, planId:plan.id, name:plan.name, start, end, weeks:plan.weeks, mode:plan.mode, opt, km: plan.race ? km : null, sessions, active:true, createdAt:new Date().toISOString() };
}

let planRuns = [];
function clearPlanInjection(){
  for (let i = WORKOUTS.length-1; i>=0; i--){
    const w = WORKOUTS[i];
    if (w.synthetic){ WORKOUTS.splice(i,1); continue; }
    w.items = w.items.filter(it => !it.plan);
    delete w.planHide; delete w.planLabel;
    if (w._focus0 !== undefined){ w.focus = w._focus0; delete w._focus0; }
  }
}
function applyPlanRuns(){
  const keepDate = WORKOUTS[curIdx] ? WORKOUTS[curIdx].date : todayStr();
  clearPlanInjection();
  planRuns.filter(r => r.active !== false).forEach(run => {
    if (run.mode === 'replace') WORKOUTS.forEach(w => { if (!w.synthetic && w.date >= run.start && w.date <= run.end) w.planHide = true; });
    (run.sessions || []).forEach(s => {
      let w = WORKOUTS.find(x => x.date === s.date);
      if (!w){
        w = { week:s.week, day:s.dow, date:s.date, phase:run.name, focus:s.focus, items:[], synthetic:true };
        WORKOUTS.push(w);
      } else if (!w.synthetic){
        if (w._focus0 === undefined) w._focus0 = w.focus;
        w.focus = run.mode === 'replace' ? s.focus : w._focus0 + ' + ' + s.focus;
        if (run.mode === 'replace') w.planLabel = `Week ${s.week} · ${run.name}`;
      }
      w.items = w.items.concat(s.items.map(uItem));
    });
  });
  WORKOUTS.sort((a,b) => a.date.localeCompare(b.date));
  const idx = WORKOUTS.findIndex(w => w.date === keepDate);
  curIdx = idx >= 0 ? idx : findTodayIdx();
}
function watchPlanRuns(){
  if (!db) return;
  try{
    db.collection('planRuns').limit(30).onSnapshot(snap => {
      planRuns = snap.docs.map(d => d.data()).filter(Boolean);
      applyPlanRuns();
      watchDayLogs(); watchDayEdit();
      if (view==='today') renderDay();
      else if (view==='plan' && curSub()==='plans') drawPlans();
    }, err => console.warn('plan runs error', err));
  }catch(e){ console.warn(e); }
}

/* ---- Plans screen ---- */
let planPick = null;
function renderPlans(){
  const main = mainEl();
  if (offline || !db){ main.innerHTML = offlineNote(); return; }
  main.innerHTML = '<div id="plActive"></div><div class="notes">Pick a template, set a start date and it fills your calendar. Plans that replace workouts only hide your scheduled ones on those days. Your logs stay.</div><div id="plLib"></div>';

}
function drawPlans(){
  if (curSub()!=='plans' || view!=='plan') return;
  const act = document.getElementById('plActive'), lib = document.getElementById('plLib');
  if (!act || !lib) return;
  const today = todayStr();
  const active = planRuns.filter(r => r.active !== false);
  act.innerHTML = active.map(r => {
    const wk = today < r.start ? 0 : Math.min(r.weeks, Math.floor((new Date(today+'T12:00:00') - new Date(r.start+'T12:00:00'))/86400000/7)+1);
    return `<div class="card"><div class="exhead"><div class="exname">${esc(r.name)}</div><button class="ghostbtn" data-endplan="${esc(r.id)}">End plan</button></div>
      <div class="notes">${today < r.start ? 'Starts ' + fmtDate(r.start) : today > r.end ? 'Finished ' + fmtDate(r.end) : 'Week ' + wk + ' of ' + r.weeks} · ${fmtDate(r.start)} to ${fmtDate(r.end)}${r.mode==='replace' ? ' · replaces scheduled workouts' : ' · added to your lifting'}</div></div>`;
  }).join('');
  lib.innerHTML = PLAN_LIB.map(p => `
    <div class="card"><div class="exhead"><div class="exname">${esc(p.name)}</div><button class="ghostbtn" data-startplan="${p.id}">Set up</button></div>
      <div class="chips"><span class="chip">${esc(p.setting)}</span><span class="chip">${p.weeks} ${p.weeks===1?'week':'weeks'}</span><span class="chip">${p.mode==='replace' ? 'replaces workouts' : 'adds sessions'}</span></div>
      <div class="notes">${esc(p.desc)}</div></div>`).join('');

}
function openPlanSheet(id){
  const p = PLAN_LIB.find(x => x.id === id); if (!p) return;
  planPick = { id, opt:p.def, km:10 };
  const monday = mondayOnOrAfter(todayStr());
  const defStart = p.pick==='trip' ? todayStr() : monday;
  const lab = p.pick==='days' ? 'Training days per week' : p.pick==='extras' ? 'Extra sessions per week' : 'Days away';
  openSheet(`
    <div><div class="brand">${CAIRN_LOGO}CAIRN</div><h2 style="font-size:24px;">${esc(p.name)}</h2><div class="notes">${esc(p.desc)}</div></div>
    <div class="bfield"><label for="plStart">Start date${p.pick==='trip' ? '' : ' (a Monday works best)'}</label><input id="plStart" type="date" value="${defStart}"></div>
    <div><div class="jlabel">${lab}</div><div class="rareas" id="plOpts">${p.opts.map(n => `<button class="mpick ${n===p.def?'on':''}" data-plopt="${n}" style="min-width:44px;">${n}</button>`).join('')}</div></div>
    ${p.race ? `<div><div class="jlabel">Race distance</div><div class="rareas" id="plKm">${[[5,'5K'],[10,'10K'],[21,'Half / Beast']].map(([k,l]) => `<button class="mpick ${k===10?'on':''}" data-plkm="${k}">${l}</button>`).join('')}</div><div class="notes">Long runs and rucks scale to this distance. 10K is the default.</div></div>` : ''}
    <div class="notes" id="plWarn"></div>
    <button class="savebtn" id="plGo">Start plan</button>
    <button class="ghostbtn" id="plCancel">Cancel</button>`);
  const warn = document.getElementById('plWarn');
  const active = planRuns.filter(r => r.active !== false);
  if (active.length) warn.textContent = 'Starting this ends your current plan (' + active.map(r => r.name).join(', ') + '). Logged sets stay.';
  document.querySelectorAll('[data-plopt]').forEach(b => b.onclick = () => { planPick.opt = Number(b.dataset.plopt); document.querySelectorAll('[data-plopt]').forEach(x => x.classList.toggle('on', x===b)); });
  document.querySelectorAll('[data-plkm]').forEach(b => b.onclick = () => { planPick.km = Number(b.dataset.plkm); document.querySelectorAll('[data-plkm]').forEach(x => x.classList.toggle('on', x===b)); });
  document.getElementById('plCancel').onclick = closeSheet;
  document.getElementById('plGo').onclick = () => startPlan(p);
}
async function startPlan(p){
  let start = document.getElementById('plStart').value || todayStr();
  if (p.pick !== 'trip') start = mondayOnOrAfter(start);
  const run = buildRun(p, start, planPick.opt, planPick.km);
  try{
    for (const r of planRuns.filter(x => x.active !== false)){ await db.doc('planRuns/'+r.id).set(Object.assign({}, r, { active:false, endedAt:new Date().toISOString() })); }
    await db.doc('planRuns/'+run.id).set(run);
  }catch(e){ console.warn('start plan failed', e); document.getElementById('plWarn').textContent = 'Could not save the plan.'; return; }
  planRuns = planRuns.map(r => r.active !== false ? Object.assign({}, r, { active:false }) : r).concat([run]);
  applyPlanRuns(); watchDayLogs(); watchDayEdit();
  closeSheet();
  if (view==='plan') drawPlans();
}
async function endPlan(id){
  const r = planRuns.find(x => x.id === id); if (!r) return;
  try{ await db.doc('planRuns/'+id).set(Object.assign({}, r, { active:false, endedAt:new Date().toISOString() })); }catch(e){ console.warn(e); return; }
  planRuns = planRuns.map(x => x.id === id ? Object.assign({}, x, { active:false }) : x);
  applyPlanRuns(); watchDayLogs(); watchDayEdit();
  drawPlans();
}

/* ================= PLAN: SETTINGS ================= */
const BACKUP_COLLS = ['logs','dayEdits','state','readiness','sessions','bodyweight','functional','flares','skips','sticking','maxhist','planRuns','exnotes'];
async function exportBackup(){
  const msg = document.getElementById('bkMsg');
  if (!db || offline){ msg.textContent = 'Not connected.'; return; }
  msg.textContent = 'Exporting...';
  try{
    const out = { app:'cairn', version:1, exportedAt:new Date().toISOString(), data:{} };
    for (const c of BACKUP_COLLS){
      const snap = await db.collection(c).get();
      out.data[c] = {};
      snap.docs.forEach(d => { out.data[c][d.id] = d.data(); });
    }
    const blob = new Blob([JSON.stringify(out, null, 1)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'cairn-backup-' + todayStr() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    msg.textContent = 'Exported ' + Object.values(out.data).reduce((n,o) => n + Object.keys(o).length, 0) + ' records.';
  }catch(e){ console.warn(e); msg.textContent = 'Export failed.'; }
}
async function importBackup(file){
  const msg = document.getElementById('bkMsg');
  if (!db || offline){ msg.textContent = 'Not connected.'; return; }
  try{
    const j = JSON.parse(await file.text());
    if (!j || j.app !== 'cairn' || !j.data) throw new Error('not a Cairn backup');
    let n = 0;
    for (const c of BACKUP_COLLS){
      const docs = j.data[c] || {};
      for (const id of Object.keys(docs)){
        await db.collection(c).doc(id).set(docs[id]);
        n++;
        if (n % 20 === 0) msg.textContent = 'Importing... ' + n;
      }
    }
    msg.textContent = 'Imported ' + n + ' records.';
  }catch(e){ console.warn(e); msg.textContent = 'Import failed: ' + (e.message || 'bad file'); }
}

/* iOS home-screen apps sometimes report a viewport shorter than the screen; push bottom-fixed UI down by the missing amount */
function fixViewport(){
  let gap = 0;
  try{
    const st = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
    if (st && innerHeight > innerWidth){
      const p = document.createElement('div');
      p.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:100lvh;visibility:hidden;pointer-events:none';
      document.body.appendChild(p);
      const lv = p.getBoundingClientRect().height; p.remove();
      gap = Math.round(lv - innerHeight); if (gap < 12 || gap > 120) gap = 0;
    }
  }catch(e){}
  document.documentElement.style.setProperty('--vgap', gap + 'px');
}
/* iOS home-screen apps use a shorter viewport while scrolled exactly to the top; sitting 1px down avoids it */
function nudgeScroll(){ try{ if (window.scrollY < 1 && document.documentElement.scrollHeight > innerHeight) window.scrollTo(0,1); }catch(e){} }
window.addEventListener('scroll', () => { if (window.scrollY < 1) nudgeScroll(); }, { passive:true });
['load','pageshow','focus','orientationchange'].forEach(ev => window.addEventListener(ev, () => setTimeout(nudgeScroll, 50)));
document.addEventListener('visibilitychange', () => setTimeout(nudgeScroll, 50));
setInterval(nudgeScroll, 1500);
setTimeout(nudgeScroll, 200);
fixViewport();
['resize','orientationchange','pageshow','focus'].forEach(ev => window.addEventListener(ev, fixViewport));
document.addEventListener('visibilitychange', fixViewport);
[300, 1000, 2500].forEach(ms => setTimeout(fixViewport, ms));
setInterval(fixViewport, 1500);
['touchstart','scroll'].forEach(ev => window.addEventListener(ev, fixViewport, { passive:true }));
init();
if ('serviceWorker' in navigator){ window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(e => console.warn('sw', e)); }); }
